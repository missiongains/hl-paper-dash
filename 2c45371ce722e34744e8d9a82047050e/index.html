<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>HL Paper Live</title>
<style>body{font-family:system-ui,sans-serif;margin:12px;background:#0f1117;color:#e6e6e6}.cards{display:flex;flex-wrap:wrap;gap:8px}.c{background:#1a1d27;padding:10px 14px;border-radius:8px;min-width:140px}.c b{display:block;font-size:20px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-bottom:16px}td,th{border-bottom:1px solid #333;padding:4px 6px;text-align:right}th{color:#999}.g{color:#3fb950}.r{color:#f85149}canvas{width:100%;height:260px;background:#1a1d27;border-radius:8px}.wrap{max-height:400px;overflow:auto}</style></head><body>
<h3>Hyperliquid paper trader: PAPER ONLY, read-only (public snapshot, updates every 5 min) <span id=upd style="font-size:12px;color:#888"></span></h3>
<div class=cards id=cards></div><h4>Equity &amp; drawdown <small>(hover)</small></h4><canvas id=ch></canvas><div id=tip style="font-size:12px;color:#aaa;height:16px"></div>
<h4>Positions (live mark)</h4><table id=pos></table><h4>Open maker orders</h4><table id=ord></table><h4>Trade log</h4><div class=wrap><table id=tr></table></div>
<script>
const T=new URLSearchParams(location.search).get('token');const f=(x,d=2)=>Number(x).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});const cl=x=>x>=0?'g':'r';let pts=[];
function draw(){const cv=document.getElementById('ch'),W=cv.width=cv.clientWidth*2,H=cv.height=520,x=cv.getContext('2d');if(pts.length<1)return;
const e=pts.map(p=>p.equity),lo=Math.min(...e,25000)*0.995,hi=Math.max(...e,25000)*1.005,n=pts.length,X=i=>40+(W-60)*(n<2?0.5:i/(n-1)),Y=v=>20+(H*0.65-20)*(1-(v-lo)/(hi-lo));
x.strokeStyle='#444';x.beginPath();x.moveTo(40,Y(25000));x.lineTo(W-20,Y(25000));x.stroke();x.fillStyle='#888';x.font='20px sans-serif';x.fillText(f(hi,0),2,24);x.fillText(f(lo,0),2,H*0.65);
x.strokeStyle='#58a6ff';x.lineWidth=3;x.beginPath();e.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();e.forEach((v,i)=>{x.fillStyle='#58a6ff';x.fillRect(X(i)-3,Y(v)-3,6,6)});
let pk=-1e9;const dd=e.map(v=>(pk=Math.max(pk,v),v/pk-1)),mn=Math.min(-0.05,...dd),D=v=>H*0.72+(H*0.26)*(v/mn);x.fillStyle='rgba(248,81,73,.5)';x.beginPath();x.moveTo(X(0),D(0));dd.forEach((v,i)=>x.lineTo(X(i),D(v)));x.lineTo(X(n-1),D(0));x.fill();x.fillStyle='#888';x.fillText('DD '+f(mn*100,1)+'%',2,H-6);
cv.onmousemove=ev=>{const r=cv.getBoundingClientRect(),i=Math.round(((ev.clientX-r.left)*2-40)/(W-60)*(n-1));const p=pts[Math.max(0,Math.min(n-1,i))];document.getElementById('tip').textContent=new Date(p.ts).toLocaleString()+'  equity $'+f(p.equity)+'  dd '+f((p.dd||0)*100)+'%'+(p.live?' (live)':'')}}
async function load(){try{const d=await (await fetch('data.json?'+Date.now())).json();const pnl=d.live_equity-d.start,dr=d.live_equity/d.day_start-1,ddn=d.live_equity/d.peak-1;
const risk=d.halted?'HALTED':(dr<-0.05?'DAILY STOP':'OK');
document.getElementById('cards').innerHTML=[['Live equity','$'+f(d.live_equity)],['Total PnL',`<span class=${cl(pnl)}>$${f(pnl)} (${f(pnl/d.start*100)}%)</span>`],['Since last cycle',`<span class=${cl(d.live_equity-d.cycle_equity)}>$${f(d.live_equity-d.cycle_equity)}</span>`],['Funding earned','$'+f(d.funding)],['Gross leverage',f(d.gross_lev)+'x / 4x'],['Max coin',f(d.max_coin*100,1)+'% / 40%'],['Day return',f(dr*100)+'% (stop -5%)'],['From peak',f(ddn*100)+'% (halt -25%)'],['Risk status',`<span class=${risk=='OK'?'g':'r'}>${risk}</span>`]].map(a=>`<div class=c>${a[0]}<b>${a[1]}</b></div>`).join('');
document.getElementById('pos').innerHTML='<tr><th>Coin<th>Side<th>Size<th>Notional<th>Mark<th>Last cycle px<th>PnL since cycle</tr>'+d.positions.map(p=>`<tr><td>${p.coin}<td class=${p.side=='LONG'?'g':'r'}>${p.side}<td>${f(Math.abs(p.size),4)}<td>$${f(Math.abs(p.notional),0)}<td>${p.mark.toPrecision(6)}<td>${p.last_cycle_px.toPrecision(6)}<td class=${cl(p.pnl_since_cycle)}>$${f(p.pnl_since_cycle)}</tr>`).join('');
document.getElementById('tr').innerHTML='<tr><th>Time<th>Coin<th>Side<th>Size<th>Price<th>Notional<th>Fee</tr>'+d.trades.map(t=>`<tr><td>${new Date(t.ts).toLocaleString()}<td>${t.coin}<td class=${t.side=='BUY'?'g':'r'}>${t.side}<td>${f(Math.abs(t.size),4)}<td>${Number(t.px).toPrecision(6)}<td>$${f(Math.abs(t.notional),0)}<td>$${f(t.fee)}</tr>`).join('');
document.getElementById('ord').innerHTML='<tr><th>Coin<th>Side<th>Limit<th>Notional<th>Posted<th>Age (cycles)</tr>'+(d.orders||[]).map(o=>`<tr><td>${o.coin}<td class=${o.q>0?'g':'r'}>${o.q>0?'BUY':'SELL'}<td>${Number(o.px).toPrecision(6)}<td>$${f(Math.abs(o.q*o.px),0)}<td>${new Date(o.ts).toLocaleString()}<td>${o.age}</tr>`).join('');pts=d.equity.concat([{ts:new Date(d.now*1000).toISOString(),equity:d.live_equity,dd:ddn,live:1}]);draw();
document.getElementById('upd').textContent='updated '+new Date().toLocaleTimeString()+' · prices '+Math.round(d.mids_age)+'s old'}catch(e){document.getElementById('upd').textContent='error '+e}}
load();setInterval(load,7000);onresize=draw;
</script></body></html>
